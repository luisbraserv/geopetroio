# =====================================================================
# Mosquitto — broker de telemetria do GeopetroIO
#
# Consumidor unico: Backend-Telemetria-Sonda-Geopetro-io
# Produtores: instalacoes do Desktop-Sonda nas sondas
# =====================================================================

listener 1883 0.0.0.0

# SEC-009: acesso anonimo DESABILITADO. Sem isto, qualquer host com acesso
# de rede pode publicar telemetria forjada em telemetria/{qualquer}/batch,
# ou assinar e ler a telemetria de toda a frota.
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# QoS 1 exige que o broker guarde mensagens em voo. Este teto evita que uma
# sonda com rede instavel consuma memoria indefinidamente.
max_queued_messages 10000

# Uma leitura tem poucas centenas de bytes; 256 KB e folga generosa e limita
# o estrago de um payload malformado ou malicioso.
message_size_limit 262144
