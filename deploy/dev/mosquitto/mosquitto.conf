# =====================================================================
# Mosquitto — DESENVOLVIMENTO LOCAL
#
# ⚠️ allow_anonymous true. Isto e aceitavel APENAS aqui, onde o broker
#    escuta em localhost numa maquina de desenvolvimento.
#
#    Em producao o broker exige autenticacao (SEC-009) — ver
#    deploy/vm2-telemetria/mosquitto/mosquitto.conf.
# =====================================================================

listener 1883 0.0.0.0

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

max_queued_messages 10000
message_size_limit 262144
