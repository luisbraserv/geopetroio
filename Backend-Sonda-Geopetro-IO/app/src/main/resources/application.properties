spring.application.name=Backend-Sonda-Geopetro-IO
# O perfil e sobrescrivel por SPRING_PROFILES_ACTIVE. A imagem Docker ja define 'prod'
# (ver Dockerfile) — o default 'dev' aqui serve so para execucao local pela IDE/mvnw.
# Subir em producao com 'dev' apontaria para MySQL em localhost e usaria o segredo JWT
# de desenvolvimento; por isso ProfileGuard registra alerta quando isso acontece.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/auth/**,/usuarios/**,/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# security.jwt.secret NAO tem valor aqui de proposito: este arquivo vale para todos
# os perfis. O segredo de desenvolvimento fica em application-dev.properties e o de
# producao vem de JWT_SECRET em application-prod.properties. Subir sem perfil
# definido falha no startup, em vez de assinar tokens com uma chave publica.
security.jwt.expiration-seconds=3600

monitoramento.base-url=${MONITORAMENTO_BASE_URL:http://localhost:8081}
monitoramento.timeout-ms=5000

# Sem configuracao MQTT: este backend NAO consome o broker.
# O produtor de telemetria e o Desktop-Sonda-Geopetro-IO e o consumidor e o
# Backend-Telemetria-Sonda-Geopetro-io. Este servico apenas CONSULTA as series
# ja processadas, via REST (monitoramento.base-url acima).

# --- Actuator: apenas health, exposto para os probes do orquestrador ---
# Nenhum outro endpoint e exposto: /env e /configprops vazariam configuracao.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# O readiness so fica pronto quando o banco responde — evita receber trafego antes disso.
management.health.db.enabled=true
