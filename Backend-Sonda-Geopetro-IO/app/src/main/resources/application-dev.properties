spring.datasource.url=jdbc:mysql://localhost:3306/geopetro_io?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bilzao90}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Segredo exclusivo de desenvolvimento local. NUNCA usar em outro ambiente:
# em producao o valor vem de JWT_SECRET (ver application-prod.properties).
security.jwt.secret=${JWT_SECRET:dev-only-nao-usar-fora-do-ambiente-local-geopetro-io-0000000000}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:4300,http://127.0.0.1:4300}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com}
