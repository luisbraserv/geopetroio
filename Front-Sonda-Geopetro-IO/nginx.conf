server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- API do Backend-Sonda (mesma origem -> sem CORS) ----
    location /api/        { proxy_pass http://backend-sonda:8080; }
    location /auth/       { proxy_pass http://backend-sonda:8080; }
    location /usuarios/   { proxy_pass http://backend-sonda:8080; }
    location /swagger-ui  { proxy_pass http://backend-sonda:8080; }
    location /v3/         { proxy_pass http://backend-sonda:8080; }

    # ---- API de telemetria (series do InfluxDB) ----
    # front chama /telemetria/api/monitoramentos/... -> telemetria:8081/api/monitoramentos/...
    location /telemetria/ { proxy_pass http://telemetria:8081/; }

    # ---- Tempo real (STOMP sobre WebSocket) ----
    #
    # Precisa de bloco proprio: um proxy_pass comum encaminha HTTP mas descarta o handshake de
    # upgrade, e a conexao falha sem erro visivel no servidor. Os tres cabecalhos abaixo sao o
    # que transforma a requisicao em WebSocket.
    #
    # O timeout longo e proposital: o canal fica aberto e ocioso entre leituras, e o padrao de
    # 60s do nginx derrubaria a conexao a cada minuto — o front reconectaria em laco.
    location /ws {
        proxy_pass http://backend-sonda:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- index.html nunca em cache: garante que cada deploy novo seja carregado ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---- assets com hash no nome podem ser cacheados por muito tempo ----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA: rotas do Angular caem no index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
