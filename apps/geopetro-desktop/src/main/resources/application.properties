spring.application.name=Geopetro Desktop
spring.main.web-application-type=none

# Desktop
app.title=Geopetro Desktop
app.version=0.1.0

# H2 database (caminho absoluto no home do usuario - evita problemas de permissao em C:\Program Files)
spring.datasource.url=jdbc:h2:${user.home}/.geopetro-io/data/sonda_geopetro;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.root=INFO
logging.level.com.geopetro.desktop=DEBUG
logging.file.name=${user.home}/.geopetro-io/logs/geopetro-desktop.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Retencao do historico local, em dias. Zero desliga a poda e a tabela cresce sem limite.
# Ver RN-100: uma linha por grandeza a 1 Hz sao ~691 mil linhas por dia com 8 cards.
app.retencao-leituras-dias=180
