# =====================================================================
# Enderecos temporarios de DESENVOLVIMENTO, usados pelo Desktop INSTALADO.
#
# O instalador (scripts/package-installer-exe.ps1) empacota este arquivo
# no jar. Na estacao instalada estes valores valem sobre o que estiver
# no app-settings.json, e a tela de Configuracoes os mostra sem deixar
# editar: ninguem digita servidor em campo.
#
# Em desenvolvimento (mvnw javafx:run) este arquivo e ignorado, e os
# enderecos continuam os de app-settings.json (localhost por padrao).
#
# Mudou o servidor de producao (dominio, HTTPS)? Troque aqui e gere um
# instalador novo.
# =====================================================================

# Identidade e usuarios. Na borda da VM, Core e Backend compartilham a mesma origem.
core.url=http://2.25.227.207

# API de negocio e tempo real (WebSocket em <url>/ws).
backend.url=http://2.25.227.207

# Broker MQTT do historico de telemetria.
telemetria.url=tcp://2.25.227.207:1883
telemetria.usuario=telemetria
