spring.datasource.url=jdbc:mysql://localhost:3306/geopetro_io?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bilzao90}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate, nao update: quem cria e altera tabela agora e o Flyway, em todos os
# perfis. Com update, o Hibernate corrigia em silencio o que faltasse no banco
# local — e foi assim que simulador_pocos nasceu no MySQL de desenvolvimento sem
# ninguem rodar migration nenhuma. O preco daquilo e um ambiente que passa nos
# testes e uma producao que nao sobe.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:4300,http://127.0.0.1:4300}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com}
