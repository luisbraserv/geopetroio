spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Bind the deployment variables explicitly: otherwise SecurityConfig falls back to localhost.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://geopetro-io.braserv.com.br}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
