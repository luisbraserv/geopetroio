spring.application.name=Geopetro-Backend
# O perfil e sobrescrivel por SPRING_PROFILES_ACTIVE. A imagem Docker ja define 'prod'
# (ver Dockerfile) — o default 'dev' aqui serve so para execucao local pela IDE/mvnw.
# Subir em producao com 'dev' apontaria para MySQL em localhost e usaria o segredo JWT
# de desenvolvimento; por isso ProfileGuard registra alerta quando isso acontece.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# --- Braserv-Core (RN-115, RN-117) ---
# Login, usuarios e unidades vem do core. Este backend so confere tokens, com a chave
# publica do core, e pergunta o acesso atual e o catalogo de unidades nas rotas internas.
core.url=${CORE_URL:http://localhost:8082}
core.cliente.id=${CORE_CLIENTE_ID:geopetro-backend}
core.cliente.segredo=${CORE_CLIENTE_SEGREDO:}
core.timeout-ms=3000
# Janela do corte de acesso de conta desativada (RN-062, RN-107).
core.cache.acesso-segundos=10
# Core sem resposta: o ultimo acesso conhecido vale por ate 5 min, depois nega (D-4).
core.cache.acesso-tolerancia-segundos=300
core.cache.unidades-segundos=60

monitoramento.base-url=${MONITORAMENTO_BASE_URL:http://localhost:8081}
monitoramento.timeout-ms=5000

# --- Flyway: o schema deixou de ser evoluido a mao (DT-002) ---
# Ate 2026-09-06 conviviam tres mecanismos: ddl-auto, scripts SQL rodados
# manualmente e um initializer em runtime. Agora ha um so, e ele vale em
# todos os perfis — inclusive dev, onde ddl-auto=update passou a validate.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base que JA EXISTE nao tem historico do Flyway. baseline-on-migrate cria a
# tabela de controle e marca V2026.09.04 como aplicada SEM executa-la — o
# schema daquela versao ja esta la. A migracao comeca de fato em 2026.09.05.
# Numa base vazia, o baseline roda normalmente e cria tudo.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2026.09.04
spring.flyway.baseline-description=Schema anterior a entrevista de produto de 2026-09-05
# Um script ja aplicado que muda de conteudo passa a quebrar o startup, em vez
# de divergir em silencio entre ambientes.
spring.flyway.validate-on-migrate=true
# Producao nao pode consertar historico sozinha: um script corrigido depois de
# aplicado exige decisao humana, nao um repair automatico no boot.
spring.flyway.clean-disabled=true

# Sem configuracao MQTT: este backend NAO consome o broker.
# O produtor de telemetria e o Geopetro-Desktop e o consumidor e o
# Geopetro-Telemetria. Este servico apenas CONSULTA as series
# ja processadas, via REST (monitoramento.base-url acima).

# --- Actuator: apenas health, exposto para os probes do orquestrador ---
# Nenhum outro endpoint e exposto: /env e /configprops vazariam configuracao.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# O readiness so fica pronto quando o banco responde — evita receber trafego antes disso.
management.health.db.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Erros de validacao podem conter tokens.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
