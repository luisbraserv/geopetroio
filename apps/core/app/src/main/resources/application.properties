spring.application.name=Braserv-Core
server.port=${PORT:8082}
# O perfil e sobrescrivel por SPRING_PROFILES_ACTIVE. A imagem Docker define 'prod';
# o default 'dev' aqui serve so para execucao local pela IDE/mvnw. ProfileGuard
# registra alerta quando 'dev' sobe apontando para um banco que nao e local.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# --- Tokens (RN-117) ---
# security.jwt.chave-privada NAO tem valor aqui de proposito: este arquivo vale para
# todos os perfis. O de desenvolvimento fica em application-dev.properties e o de
# producao vem de JWT_CHAVE_PRIVADA em application-prod.properties.
security.jwt.expiration-seconds=3600
# Janela do corte de acesso de conta desativada (RN-062).
security.cache-status-segundos=10
# Token de servico (RN-117): curto, porque desativar um sistema so impede tokens novos.
security.token-servico.validade-segundos=900
# Primeira subida: cria o cliente geopetro-backend com este segredo, se ele nao existir.
# Depois disso a variavel pode sair do .env; o segredo e gerido pela tela de sistemas.
core.servicos.segredo-inicial-backend=${CORE_SEGREDO_INICIAL_BACKEND:}
# Geopetro-Backend: confirma se uma unidade nunca foi usada antes de excluir (RN-116).
# Sem resposta em core.backend.timeout-ms, a exclusao e recusada.
core.backend.timeout-ms=5000

# Recuperacao de senha: habilitar somente apos configurar o SMTP e a origem web.
recovery.enabled=${PASSWORD_RECOVERY_ENABLED:false}
recovery.frontend-url=${PASSWORD_RECOVERY_FRONTEND_URL:}
recovery.from=${PASSWORD_RECOVERY_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Flyway: dono do schema braserv_core ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base que ja existe sem historico do Flyway (tabelas movidas do Geopetro-Backend pelo
# script deploy/vm-unica/core/mover-para-core.sql): a versao inicial e marcada como
# aplicada SEM executar, porque o script deixa o schema igual a ela. Em base vazia, o
# baseline nao se aplica e a versao inicial cria tudo.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2026.10.06.1
spring.flyway.baseline-description=Tabelas movidas do Geopetro-Backend
# Um script ja aplicado que muda de conteudo quebra o startup, em vez de divergir em silencio.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# --- Actuator: apenas health, exposto para os probes do orquestrador ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# DTOs de identidade e erros de validacao podem conter senhas/tokens.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO

# Chave exclusiva do SMTP, fora do banco. MESMO caminho padrao do Geopetro-Backend de
# proposito: configuracao_smtp e movida para ca com a senha ja cifrada, e so decifra
# com a chave que a cifrou.
smtp.settings.key-file=${SMTP_SETTINGS_KEY_FILE:${user.home}/.geopetro/smtp-settings.key}
smtp.settings.encryption-key=${SMTP_SETTINGS_ENCRYPTION_KEY:}
