spring.datasource.url=jdbc:mysql://localhost:3306/braserv_core?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate, nao update: quem cria e altera tabela e o Flyway, em todos os perfis.
spring.jpa.hibernate.ddl-auto=validate

# SMTP is optional locally; enable its probe explicitly when configuring mail.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chave de assinatura de desenvolvimento: gerada no primeiro start, fora do repositorio.
# NUNCA usar em outro ambiente: em producao a chave vem de JWT_CHAVE_PRIVADA.
security.jwt.chave-privada=${JWT_CHAVE_PRIVADA:${user.home}/.braserv-core/jwt-dev.pem}
security.jwt.gerar-se-ausente=true

core.backend.url=${GEOPETRO_BACKEND_URL:http://localhost:8080}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:4300,http://127.0.0.1:4300}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com}
