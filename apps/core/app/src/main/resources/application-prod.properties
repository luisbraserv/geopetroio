spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# A chave e provida, nunca gerada: uma chave nova a cada deploy invalidaria todos os
# tokens sem ninguem entender o motivo. Sem o arquivo, o core nao sobe.
security.jwt.chave-privada=${JWT_CHAVE_PRIVADA}
security.jwt.chaves-publicas-anteriores=${JWT_CHAVES_PUBLICAS_ANTERIORES:}
security.jwt.gerar-se-ausente=false
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Sem valor, toda exclusao de unidade e recusada: o core nao tem a quem perguntar.
core.backend.url=${GEOPETRO_BACKEND_URL:}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://geopetro-io.braserv.com.br}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
